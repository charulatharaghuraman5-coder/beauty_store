<!DOCTYPE html>
<html>
<head>
    <title>Beauty Store - Working</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 50px;
            text-align: center;
            background: linear-gradient(135deg, #ffeef8 0%, #fff5f7 100%);
            min-height: 100vh;
        }
        h1 { color: #ff1493; font-size: 3rem; }
        .status { margin: 30px 0; font-size: 1.2rem; }
        a { color: #ff1493; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
        .box { 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>🌸 Beauty Store</h1>
        <div class="status">
            <p>✅ Application is running!</p>
            <p>Backend: <a href="http://localhost:8001" target="_blank">Port 8001</a></p>
            <p>Frontend: <a href="http://localhost:8000" target="_blank">Port 8000</a></p>
        </div>
        <hr>
        <p><a href="http://localhost:8001/docs">📚 API Documentation</a></p>
    </div>
</body>
</html>
