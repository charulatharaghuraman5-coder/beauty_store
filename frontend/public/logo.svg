<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="hyper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff00ff" />
      <stop offset="16%" style="stop-color:#00ffff" />
      <stop offset="33%" style="stop-color:#ffff00" />
      <stop offset="50%" style="stop-color:#ff0099" />
      <stop offset="66%" style="stop-color:#00ff00" />
      <stop offset="83%" style="stop-color:#ff6600" />
      <stop offset="100%" style="stop-color:#ff00ff" />
    </linearGradient>
    <radialGradient id="blast">
      <stop offset="0%" style="stop-color:#ffffff" />
      <stop offset="20%" style="stop-color:#ffff00" />
      <stop offset="40%" style="stop-color:#ff00ff" />
      <stop offset="60%" style="stop-color:#00ffff" />
      <stop offset="80%" style="stop-color:#ff0099" />
      <stop offset="100%" style="stop-color:#00ff00;stop-opacity:0" />
    </radialGradient>
    <filter id="maxGlow">
      <feGaussianBlur stdDeviation="12" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feGaussianBlur stdDeviation="4" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur3"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Hyper background -->
  <circle cx="100" cy="100" r="99" fill="url(#hyper)"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#ffff00" stroke-width="10" filter="url(#maxGlow)"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#ff00ff" stroke-width="8" filter="url(#maxGlow)"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#00ffff" stroke-width="6" filter="url(#maxGlow)"/>
  <circle cx="100" cy="100" r="78" fill="#ffffff"/>
  <circle cx="100" cy="100" r="78" fill="url(#blast)"/>
  
  <!-- Mega lipstick -->
  <g transform="translate(48, 72)" filter="url(#maxGlow)">
    <rect x="-9" y="0" width="18" height="50" rx="4" fill="#ff0099" stroke="#ffffff" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="10" ry="7" fill="#ff00ff" stroke="#ffffff" stroke-width="2"/>
    <path d="M -8,0 L -6,-16 L 6,-16 L 8,0 Z" fill="#ff66ff" stroke="#ffffff" stroke-width="2"/>
    <ellipse cx="-3" cy="-9" rx="4" ry="5" fill="#ffffff"/>
    <rect x="-9" y="26" width="18" height="6" fill="#ffff00" rx="2" stroke="#ffffff" stroke-width="2"/>
    <circle cx="-6" cy="29" r="2" fill="#ffffff"/>
    <circle cx="0" cy="29" r="2" fill="#ffffff"/>
    <circle cx="6" cy="29" r="2" fill="#ffffff"/>
  </g>
  
  <!-- Mega perfume -->
  <g transform="translate(152, 72)" filter="url(#maxGlow)">
    <rect x="-8" y="0" width="16" height="46" rx="3" fill="#00ffff" stroke="#ffffff" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="9" ry="6" fill="#00ff99" stroke="#ffffff" stroke-width="2"/>
    <path d="M -5,0 L -4,-14 L 4,-14 L 5,0 Z" fill="#ffff00" stroke="#ffffff" stroke-width="2"/>
    <circle cx="0" cy="-16" r="5" fill="#ff00ff" stroke="#ffffff" stroke-width="2"/>
    <ellipse cx="0" cy="24" rx="7" ry="12" fill="#ffffff" opacity="0.6"/>
    <circle cx="-4" cy="10" r="2" fill="#ffffff"/>
    <circle cx="4" cy="18" r="2" fill="#ffffff"/>
  </g>
  
  <!-- Mega compact -->
  <g transform="translate(100, 118)" filter="url(#maxGlow)">
    <ellipse cx="0" cy="0" rx="32" ry="20" fill="#ffff00" stroke="#ffffff" stroke-width="4"/>
    <ellipse cx="0" cy="0" rx="29" ry="18" fill="#ff00ff"/>
    <ellipse cx="0" cy="0" rx="26" ry="16" fill="#00ffff"/>
    <ellipse cx="0" cy="0" rx="23" ry="14" fill="#ff0099"/>
    <ellipse cx="0" cy="0" rx="20" ry="12" fill="#00ff00"/>
    <ellipse cx="0" cy="0" rx="17" ry="10" fill="#ff6600"/>
    <ellipse cx="0" cy="0" rx="14" ry="8" fill="#ffff00"/>
    <line x1="-29" y1="0" x2="29" y2="0" stroke="#ffffff" stroke-width="6"/>
    <ellipse cx="-14" cy="-7" rx="6" ry="5" fill="#ffffff"/>
    <circle cx="12" cy="5" r="4" fill="#ffffff"/>
  </g>
  
  <!-- Mega brush -->
  <g transform="translate(100, 54)" filter="url(#maxGlow)">
    <rect x="-5" y="0" width="10" height="28" fill="#ffff00" rx="2" stroke="#ffffff" stroke-width="2"/>
    <ellipse cx="0" cy="-7" rx="12" ry="10" fill="#ff00ff" stroke="#ffffff" stroke-width="2"/>
    <ellipse cx="0" cy="-9" rx="11" ry="9" fill="#00ffff"/>
    <ellipse cx="0" cy="-11" rx="10" ry="8" fill="#ff0099"/>
    <ellipse cx="0" cy="-13" rx="9" ry="7" fill="#ffff00"/>
    <ellipse cx="-5" cy="-11" rx="3" ry="2.5" fill="#ffffff"/>
    <circle cx="4" cy="-9" r="2" fill="#ffffff"/>
  </g>
  
  <!-- Mega stars -->
  <g filter="url(#maxGlow)">
    <path d="M 18,26 L 22,38 L 34,38 L 24,46 L 28,58 L 18,50 L 8,58 L 12,46 L 2,38 L 14,38 Z" fill="#ffff00" stroke="#ffffff" stroke-width="2"/>
    <path d="M 182,126 L 186,138 L 198,138 L 188,146 L 192,158 L 182,150 L 172,158 L 176,146 L 166,138 L 178,138 Z" fill="#ff00ff" stroke="#ffffff" stroke-width="2"/>
    <path d="M 178,40 L 181,49 L 190,49 L 183,54 L 186,63 L 178,58 L 170,63 L 173,54 L 166,49 L 175,49 Z" fill="#00ffff" stroke="#ffffff" stroke-width="2"/>
    <path d="M 22,160 L 25,169 L 34,169 L 27,174 L 30,183 L 22,178 L 14,183 L 17,174 L 10,169 L 19,169 Z" fill="#00ff00" stroke="#ffffff" stroke-width="2"/>
    <path d="M 100,20 L 103,27 L 110,27 L 105,31 L 108,38 L 100,34 L 92,38 L 95,31 L 90,27 L 97,27 Z" fill="#ff0099" stroke="#ffffff" stroke-width="2"/>
    <path d="M 185,165 L 187,170 L 192,170 L 188,173 L 190,178 L 185,175 L 180,178 L 182,173 L 178,170 L 183,170 Z" fill="#ffff00" stroke="#ffffff" stroke-width="2"/>
  </g>
  
  <!-- Mega orbs -->
  <circle cx="32" cy="60" r="5" fill="#ff00ff" stroke="#ffffff" stroke-width="2" filter="url(#maxGlow)"/>
  <circle cx="168" cy="82" r="5" fill="#00ffff" stroke="#ffffff" stroke-width="2" filter="url(#maxGlow)"/>
  <circle cx="42" cy="128" r="4.5" fill="#ffff00" stroke="#ffffff" stroke-width="2" filter="url(#maxGlow)"/>
  <circle cx="158" cy="118" r="4.5" fill="#ff0099" stroke="#ffffff" stroke-width="2" filter="url(#maxGlow)"/>
  <circle cx="12" cy="92" r="4" fill="#00ff00" stroke="#ffffff" stroke-width="2" filter="url(#maxGlow)"/>
  <circle cx="188" cy="68" r="4" fill="#ff6600" stroke="#ffffff" stroke-width="2" filter="url(#maxGlow)"/>
  <circle cx="58" cy="42" r="3.5" fill="#ff00ff" stroke="#ffffff" stroke-width="1.5" filter="url(#maxGlow)"/>
  <circle cx="142" cy="145" r="3.5" fill="#00ffff" stroke="#ffffff" stroke-width="1.5" filter="url(#maxGlow)"/>
  <circle cx="22" cy="142" r="3" fill="#ffff00" stroke="#ffffff" stroke-width="1.5" filter="url(#maxGlow)"/>
  <circle cx="178" cy="52" r="3" fill="#ff0099" stroke="#ffffff" stroke-width="1.5" filter="url(#maxGlow)"/>
  <circle cx="70" cy="155" r="2.5" fill="#00ff00" stroke="#ffffff" stroke-width="1" filter="url(#maxGlow)"/>
  <circle cx="130" cy="35" r="2.5" fill="#ff6600" stroke="#ffffff" stroke-width="1" filter="url(#maxGlow)"/>
  
  <!-- Hyper text -->
  <text x="100" y="172" font-family="'Impact', sans-serif" font-size="36" font-weight="900" fill="#ff00ff" text-anchor="middle" stroke="#ffffff" stroke-width="3" filter="url(#maxGlow)">BEAUTY</text>
  <text x="100" y="190" font-family="'Impact', sans-serif" font-size="20" fill="#ffff00" text-anchor="middle" letter-spacing="6" font-weight="900" stroke="#ffffff" stroke-width="2" filter="url(#maxGlow)">STORE</text>
</svg>
