<!DOCTYPE html>
<html>
<head>
    <title>Test Page</title>
</head>
<body>
    <h1>Testing Frontend</h1>
    <div id="status"></div>
    <script>
        fetch('http://localhost:8000/src/App.jsx')
            .then(r => r.text())
            .then(data => {
                document.getElementById('status').innerHTML = '<pre>' + data.substring(0, 500) + '</pre>';
            })
            .catch(err => {
                document.getElementById('status').innerHTML = 'Error: ' + err;
            });
    </script>
</body>
</html>
