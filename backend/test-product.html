<!DOCTYPE html>
<html>
<head>
    <title>Test Product Display</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .product { border: 1px solid #ddd; padding: 20px; margin: 20px; max-width: 300px; }
        img { width: 100%; height: 200px; object-fit: cover; }
    </style>
</head>
<body>
    <h1>Product Test</h1>
    <div id="products"></div>
    <script>
        fetch('/api/products/?limit=1')
            .then(r => r.json())
            .then(data => {
                const p = data[0];
                document.getElementById('products').innerHTML = `
                    <div class="product">
                        <img src="${p.image_url}" alt="${p.name}">
                        <h3>${p.name}</h3>
                        <p>${p.brand} - ${p.category}</p>
                        <p>₹${p.price}</p>
                        <p>${p.description}</p>
                    </div>
                `;
            })
            .catch(e => {
                document.getElementById('products').innerHTML = `<p style="color:red">Error: ${e.message}</p>`;
            });
    </script>
</body>
</html>
