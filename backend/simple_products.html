<!DOCTYPE html>
<html>
<head>
    <title>Beauty Store - Products</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #ffeef8; padding: 20px; }
        h1 { text-align: center; color: #ff1493; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; max-width: 1400px; margin: 0 auto; }
        .card { background: white; border-radius: 10px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
        .brand { color: #888; font-size: 0.85rem; text-transform: uppercase; margin-top: 10px; }
        .name { font-weight: 600; color: #333; margin: 8px 0; }
        .price { font-size: 1.3rem; font-weight: bold; color: #ff1493; }
        #loading { text-align: center; font-size: 20px; color: #666; }
    </style>
</head>
<body>
    <h1>🌸 Beauty Store - All Products</h1>
    <div id="loading">Loading products...</div>
    <div id="products" class="grid"></div>
    
    <script>
        fetch('/api/products/')
            .then(res => res.json())
            .then(products => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('products').innerHTML = products.map(p => `
                    <div class="card">
                        <img src="${p.image_url}" alt="${p.name}">
                        <div class="brand">${p.brand}</div>
                        <div class="name">${p.name}</div>
                        <div class="price">₹${p.price}</div>
                    </div>
                `).join('');
            })
            .catch(err => {
                document.getElementById('loading').innerHTML = 'Error loading products: ' + err;
            });
    </script>
</body>
</html>
