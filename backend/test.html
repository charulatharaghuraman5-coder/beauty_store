<!DOCTYPE html>
<html>
<head>
    <title>Beauty Store</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        .header { background: #ff1493; color: white; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
        .nav { display: flex; gap: 1rem; }
        .nav button { background: white; color: #ff1493; border: none; padding: 0.5rem 1rem; cursor: pointer; border-radius: 5px; }
        .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 2rem; padding: 2rem; }
        .card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 250px; object-fit: cover; }
        .info { padding: 1rem; }
        .price { color: #ff1493; font-size: 1.5rem; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌸 Beauty Store</h1>
        <div class="nav">
            <button onclick="filter('all')">All</button>
            <button onclick="filter('Skincare')">Skincare</button>
            <button onclick="filter('Makeup')">Makeup</button>
            <button onclick="filter('Haircare')">Haircare</button>
            <button onclick="filter('Fragrance')">Fragrance</button>
        </div>
    </div>
    <div class="products" id="products"></div>
    <script>
        let allProducts = [];
        fetch('/api/products/?limit=1000')
            .then(r => r.json())
            .then(data => {
                allProducts = data;
                display(data);
            });
        function display(products) {
            document.getElementById('products').innerHTML = products.map(p => `
                <div class="card">
                    <img src="${p.image_url}" alt="${p.name}">
                    <div class="info">
                        <div style="color: #666; font-size: 0.9rem;">${p.brand}</div>
                        <h3>${p.name}</h3>
                        <div style="color: #888; margin: 0.5rem 0;">${p.category}</div>
                        <div class="price">₹${p.price}</div>
                    </div>
                </div>
            `).join('');
        }
        function filter(cat) {
            if (cat === 'all') display(allProducts);
            else display(allProducts.filter(p => p.category === cat));
        }
    </script>
</body>
</html>
